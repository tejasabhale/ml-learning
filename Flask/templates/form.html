<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Name Form</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form-container {
        width: 400px;
        background-color: white;
        padding: 30px;

        border: 1px solid #ddd;
        border-radius: 8px;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;

        border: 1px solid #ccc;
        border-radius: 5px;

        font-size: 16px;
        margin-bottom: 20px;
      }

      button {
        width: 100%;
        padding: 10px;

        border: none;
        border-radius: 5px;

        background-color: #333;
        color: white;

        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #555;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h1>Name Form</h1>

      <form action="/form" method="POST">
        <label for="name">Name</label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        />

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
